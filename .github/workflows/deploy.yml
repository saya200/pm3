name: نشر الموقع (GitHub Pages + Firebase)

# يعمل عند كل دفع للفرع الافتراضي للمستودع، أو يدويًا من تبويب Actions
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: تحقق من الأسرار
        run: |
          missing=""
          [ -z "${{ secrets.SECTION_SLUG }}" ] && missing="$missing SECTION_SLUG"
          [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ] && missing="$missing FIREBASE_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then echo "::error::أسرار ناقصة في Settings → Secrets and variables → Actions:$missing"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

      # قواعد الأمان + الفهارس + كود الإدمن تُنشر تلقائيًا على Firebase
      - name: نشر قواعد الأمان والفهارس
        env:
          SECTION_SLUG: ${{ secrets.SECTION_SLUG }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm run rules
          npx --yes firebase-tools@15 deploy --only firestore:rules,firestore:indexes --non-interactive --force
      - name: ضبط كود الإدمن
        env:
          SECTION_SLUG: ${{ secrets.SECTION_SLUG }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
        run: |
          if [ -z "$ADMIN_CODE" ]; then echo "ADMIN_CODE غير مضبوط — تخطي"; exit 0; fi
          node notifier/set-admin-code.mjs "$ADMIN_CODE"

      - name: البناء
        run: npm run build
        env:
          # المسار العشوائي سر حتى لا يظهر في المستودع العام
          SECTION_SLUG: ${{ secrets.SECTION_SLUG }}
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
